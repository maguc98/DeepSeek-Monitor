name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate app icon
        run: swift .github/scripts/generate_app_icon.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project DeepSeekMonitor.xcodeproj \
            -scheme DeepSeekMonitor \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build for iPhone Device
        run: |
          set -euo pipefail
          xcodebuild \
            -project DeepSeekMonitor.xcodeproj \
            -scheme DeepSeekMonitor \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/DeepSeek Monitor.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"
          rm -rf build/ipa-package
          mkdir -p build/ipa-package/Payload
          cp -R "$APP_PATH" "build/ipa-package/Payload/DeepSeek Monitor.app"
          cd build/ipa-package
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/DeepSeek-Monitor-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 DeepSeek-Monitor-unsigned.ipa > DeepSeek-Monitor-unsigned.ipa.sha256
          test -s DeepSeek-Monitor-unsigned.ipa
          ls -lh DeepSeek-Monitor-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Monitor-unsigned-ipa
          path: |
            DeepSeek-Monitor-unsigned.ipa
            DeepSeek-Monitor-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
